<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #ff758c, #ff7eb3);
    font-family: 'Segoe UI', sans-serif;
  }

  .card {
    text-align: center;
    background: white;
    padding: 40px 60px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    position: relative;
  }

  h1 {
    color: #e91e63;
    font-size: 28px;
  }

  button {
    padding: 12px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: absolute;
    transition: transform 0.2s;
  }

  #yesBtn {
    background: #e91e63;
    color: white;
    left: 25%;
  }

  #noBtn {
    background: #999;
    color: white;
    left: 60%;
  }

  .message {
    margin-top: 20px;
    font-size: 22px;
    color: #e91e63;
    display: none;
  }

  .heart {
    position: fixed;
    color: #ff4d6d;
    font-size: 24px;
    animation: floatUp 3s linear forwards;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-200px) scale(1.8); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Will you be my Valentine? 💖🥺</h1>
  <button id="yesBtn">YES 💘</button>
  <button id="noBtn">NO 😜</button>
  <div class="message" id="loveMsg">I knew you'd say YES!! ❤️😍</div>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const msg = document.getElementById("loveMsg");

  let speedBoost = 1;

  function moveButton() {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const newX = Math.random() * maxX * speedBoost;
    const newY = Math.random() * maxY * speedBoost;

    noBtn.style.position = "fixed";
    noBtn.style.left = Math.min(newX, maxX) + "px";
    noBtn.style.top = Math.min(newY, maxY) + "px";

    speedBoost += 0.2; // gets crazier each time
    spawnHeart();
  }

  function spawnHeart() {
